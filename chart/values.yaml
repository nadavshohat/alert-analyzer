image:
  repository: "public.ecr.aws/j5u9j5q0/alert-analyzer"
  tag: "latest"
  pullPolicy: Always

# Model provider: bedrock (default) or vertex (Claude on Vertex AI, auth via
# GKE Workload Identity; annotate the service account with the GSA to use).
model:
  provider: "bedrock"

vertex:
  projectId: ""   # empty = project of the workload's credentials
  region: "global"
  model: ""       # e.g. claude-sonnet-5-5; empty keeps the app default

bedrock:
  region: "us-west-2"
  model: "us.anthropic.claude-sonnet-5"
  maxTokens: 2048

agent:
  maxTurns: 10
  pollInterval: 30
  dedupWindow: 1800
  logLookbackMinutes: 30

events:
  reasons: "CrashLoopBackOff,OOMKilled,BackOff,Failed,Error,Unhealthy"
  excludeNamespaces: "kube-system,groundcover"

clickhouse:
  host: "groundcover-clickhouse"
  port: 8123
  user: "default"
  database: "groundcover"

groundcover:
  baseUrl: "https://app.groundcover.com"
  clusterName: ""

timezone: "UTC"

serviceAccount:
  create: true
  name: "alert-analyzer"
  # For AWS IRSA, set: eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/<role>
  annotations: {}

rbac:
  # pods and pods/log get/list are always granted (cluster-wide, read-only) so the
  # agent can triage crashes in any namespace. allowExec additionally grants
  # create on pods/exec, which powers the read_file/list_dir/get_env investigation
  # tools. It is a cluster-wide exec grant: disable it to remove that blast radius
  # (those three tools then return "unavailable" and the agent uses logs/metrics only).
  allowExec: true

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    memory: "512Mi"

# Telemetry source selection (per signal). Defaults are all-clickhouse, so
# existing installs are unchanged. See the repo README "Telemetry backends".
sources:
  event: "clickhouse"    # clickhouse | kubernetes
  log: "clickhouse"      # clickhouse | kubernetes | loki
  metric: "clickhouse"   # clickhouse | kubernetes | prometheus
  trace: "clickhouse"    # clickhouse | none

loki:
  url: ""      # required when sources.log=loki, e.g. http://loki:3100
  tenant: ""   # sets X-Scope-OrgID for multi-tenant Loki

prometheus:
  url: ""      # required when sources.metric=prometheus, e.g. http://prometheus:9090

signoz:
  url: ""      # required when any source is signoz, e.g. http://signoz.signoz:8080

secrets:
  # Provide the two secret values inline (they land in the release), OR set
  # existingSecret to the name of a Secret you created yourself holding keys
  # CLICKHOUSE_PASSWORD and SLACK_WEBHOOK_URL (plus SIGNOZ_API_KEY when a source
  # is signoz). existingSecret wins when set; prefer it for anything sensitive.
  existingSecret: ""
  clickhousePassword: ""
  slackWebhookUrl: ""
  signozApiKey: ""

# Optional External Secrets Operator sync into secrets.existingSecret, so no
# secret value passes through Helm values or Terraform state. A key rotation
# reaches the pod on its next restart.
externalSecret:
  enabled: false
  apiVersion: "external-secrets.io/v1"
  storeName: ""
  storeKind: "ClusterSecretStore"
  refreshInterval: "1h"
  # Secret key -> remote secret name, e.g. SLACK_WEBHOOK_URL: alert-analyzer-slack-webhook-url
  data: {}
