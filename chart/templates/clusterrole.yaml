apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "alert-analyzer.fullname" . }}-pod-exec
  labels:
    {{- include "alert-analyzer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- if eq .Values.sources.event "kubernetes" }}
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  {{- end }}
  {{- if eq .Values.sources.metric "kubernetes" }}
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get"]
  {{- end }}
  {{- if .Values.rbac.allowExec }}
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  {{- end }}
