{{- if .Values.externalSecret.enabled }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ required "secrets.existingSecret must name the Secret the ExternalSecret creates" .Values.secrets.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alert-analyzer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecret.storeName is required" .Values.externalSecret.storeName }}
    kind: {{ .Values.externalSecret.storeKind }}
  target:
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
  data:
    {{- range $key, $remote := .Values.externalSecret.data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remote | quote }}
    {{- end }}
{{- end }}
